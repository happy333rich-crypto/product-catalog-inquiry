const CATS=["全部","抽衛","廚紙","衛生棉","濕巾","濕式衛生紙","白蘭","鱷魚","★常用"];
const STORAGE="gt-pda-fav-v1";
let favorites=new Set(),selected="全部",text="";
try{favorites=new Set(JSON.parse(localStorage.getItem(STORAGE)||"[]"))}catch(e){}
const cards=document.getElementById("cards"),tabs=document.getElementById("tabs"),result=document.getElementById("result");
const input=document.getElementById("q"),clear=document.getElementById("clear"),toast=document.getElementById("toast");
function norm(s){return String(s).normalize("NFKC").toLocaleLowerCase("zh-Hant")}
function saveFav(){try{localStorage.setItem(STORAGE,JSON.stringify([...favorites]))}catch(e){}}
function say(s){toast.textContent=s;toast.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove("show"),1700)}
async function copySku(s){
 try{
   if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(s)}
   else{const t=document.createElement("textarea");t.value=s;t.style.cssText="position:fixed;left:-9999px";document.body.appendChild(t);t.select();if(!document.execCommand("copy"))throw Error("copy");t.remove()}
   say("已複製 "+s);
 }catch(e){say("複製未成功，請長按貨號選取")}
}
function el(tag,klass,txt){const e=document.createElement(tag);if(klass)e.className=klass;if(txt!=null)e.textContent=txt;return e}
function renderTabs(){
 tabs.replaceChildren();
 for(const c of CATS){
  const b=el("button","tab",c);b.type="button";b.setAttribute("aria-pressed",String(selected===c));
  b.addEventListener("click",()=>{selected=c;render();b.scrollIntoView({block:"nearest",inline:"nearest"})});tabs.append(b);
 }
}
function render(){
 renderTabs();
 const q=norm(text.trim());
 const visible=PRODUCTS.filter(p=>(selected==="全部"||(selected==="★常用"?favorites.has(p.code):p.cat===selected))&&(!q||norm(p.code+" "+p.name+" "+p.cat+" "+(p.sub||"")).includes(q)));
 result.textContent="找到 "+visible.length+" 項";
 cards.replaceChildren();
 if(!visible.length){const empty=el("div","empty","沒有符合的商品，試著換個關鍵字或分類。");cards.append(empty);return}
 const frag=document.createDocumentFragment();
 for(const p of visible){
  const card=el("article","card"),top=el("div","card-top");
  const code=el("span","code",p.code),copy=el("button","copy","複製");
  copy.type="button";copy.setAttribute("aria-label","複製貨號 "+p.code);copy.addEventListener("click",()=>copySku(p.code));
  const star=el("button","star",favorites.has(p.code)?"★":"☆");star.type="button";star.setAttribute("aria-label","常用貨號 "+p.code);star.setAttribute("aria-pressed",String(favorites.has(p.code)));
  star.addEventListener("click",()=>{if(favorites.has(p.code)) favorites.delete(p.code);else favorites.add(p.code);saveFav();render()});
  top.append(code,star,copy);
  const name=el("div","name",p.name),details=el("div","detail");details.append(el("span","",p.cat));
  if(p.sub&&p.sub!==p.cat&&p.sub!=="抽取衛生紙")details.append(el("span","",p.sub));
  if(p.caution)details.append(el("span","warning","貨號請核對"));
  card.append(top,name,details);frag.append(card);
 }
 cards.append(frag);
}
input.addEventListener("input",e=>{text=e.target.value;clear.style.display=text?"block":"none";render()});
clear.addEventListener("click",()=>{input.value="";text="";clear.style.display="none";render();input.focus()});
render();
</script>
</body>
