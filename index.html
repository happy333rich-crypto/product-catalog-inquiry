<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b2b">
  <meta name="description" content="產品電子型錄與詢價清單">
  <meta name="build-version" content="20260709-1">
  <title>商品型錄</title>
  <link rel="stylesheet" href="style-v1.css?v=20260903-1">
  <script src="cache-bust.js?v=20260802-3" defer></script>
  <script src="script.js?v=20260901-1" defer></script>
  <script src="cart.js?v=20260901-1" defer></script>
  <script src="juwei-addon.js?v=20260709-1" defer></script>
  <script src="you-pin-addon.js?v=20260713-2" defer></script>
  <script src="inquiry.js?v=20260715-3" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mark" href="#top" aria-label="回到商品列表頂端">
        <strong>商品型錄</strong>
      </a>
      <div class="header-actions">
        <button class="header-search-button" type="button" data-focus-search aria-label="前往搜尋商品">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>搜尋</span>
        </button>
        <button class="header-cart-button" type="button" data-open-cart aria-label="開啟詢價清單">
          詢價
          <span class="cart-badge" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="catalog-section" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div>
          <h1 id="catalog-title">商品型錄</h1>
        </div>
        <p class="result-count" aria-live="polite"><span data-result-count>0</span> 項商品</p>
      </div>

      <div class="filters" aria-label="商品搜尋與篩選">
        <label class="search-field">
          <span class="sr-only">搜尋商品</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" data-search placeholder="搜尋品名、品牌或商品編號" autocomplete="off">
        </label>
        <button class="text-button reset-button" type="button" data-reset-filters>清除</button>

        <div class="mobile-filter-controls" aria-label="商品篩選條件">
          <label class="filter-select-field filter-select-brand">
            <span>品牌</span>
            <select data-brand-filter><option value="">全部品牌</option></select>
          </label>
          <label class="filter-select-field">
            <span>大分類</span>
            <select data-website-category-filter><option value="">全部大分類</option></select>
          </label>
          <label class="filter-select-field">
            <span>細分類</span>
            <select data-website-subcategory-filter><option value="">全部細分類</option></select>
          </label>
        </div>

        <div class="filter-navigation">
          <div class="filter-mode-tabs" role="tablist" aria-label="瀏覽商品方式">
            <button type="button" class="filter-mode-button is-active" role="tab" aria-selected="true" data-filter-mode="brand">品牌</button>
            <button type="button" class="filter-mode-button" role="tab" aria-selected="false" data-filter-mode="category">分類</button>
          </div>
          <div class="filter-panel" data-filter-panel="brand" role="tabpanel">
            <div class="filter-chip-row" data-brand-chips aria-label="品牌篩選"></div>
          </div>
          <div class="filter-panel" data-filter-panel="category" role="tabpanel" hidden>
            <div class="filter-chip-row" data-category-chips aria-label="大分類篩選"></div>
            <div class="filter-chip-row subcategory-row" data-subcategory-chips aria-label="細分類篩選" hidden></div>
          </div>
        </div>

      </div>

      <div class="status-panel" data-loading-status>
        <span class="spinner" aria-hidden="true"></span>
        正在載入商品資料…
      </div>

      <div class="product-grid" data-product-grid aria-live="polite"></div>

      <div class="empty-state" data-empty-state hidden>
        <span aria-hidden="true">🔎</span>
        <h3>沒有找到符合的商品</h3>
        <p>換個關鍵字，或清除品牌與分類篩選再試一次。</p>
        <button class="button button-secondary" type="button" data-empty-reset>清除篩選</button>
      </div>
    </section>
  </main>

  <section class="product-detail-view" data-product-detail aria-hidden="true" hidden>
    <header class="detail-header">
      <div class="detail-header-inner">
        <button class="detail-back-button" type="button" data-close-product-detail>
          <span aria-hidden="true">←</span>
          <span>商品列表</span>
        </button>
        <button class="detail-inquiry-button" type="button" data-open-cart>
          詢價清單 <span data-cart-count>0</span>
        </button>
      </div>
    </header>
    <div class="detail-layout">
      <div class="detail-image-column">
        <div class="detail-image-wrap">
          <img class="detail-product-image" data-detail-image alt="" hidden>
          <div class="detail-image-placeholder" data-detail-image-placeholder aria-hidden="true">
            <span>商品圖片</span>
            <small>圖片整理中</small>
          </div>
        </div>
      </div>
      <article class="detail-copy">
        <p class="detail-context"><span data-detail-brand></span><span aria-hidden="true">・</span><span data-detail-category></span></p>
        <h1 data-detail-name></h1>
        <dl class="detail-primary-meta">
          <div><dt>規格</dt><dd data-detail-spec></dd></div>
          <div><dt>箱入</dt><dd data-detail-case-pack></dd></div>
        </dl>

        <section class="detail-features" data-detail-features hidden>
          <h2>產品特色</h2>
          <div data-detail-feature-list></div>
        </section>

        <details class="detail-more" data-detail-more>
          <summary>更多商品資訊 <span aria-hidden="true"></span></summary>
          <dl>
            <div><dt>條碼</dt><dd data-detail-barcode></dd></div>
            <div><dt>商品編號／SKU</dt><dd data-detail-sku></dd></div>
          </dl>
        </details>

        <button class="button button-primary detail-add-button add-button" type="button" data-detail-add>加入詢價</button>
      </article>
    </div>
  </section>

  <button class="mobile-cart-bar" type="button" data-open-cart>
    <span>查看詢價清單</span>
    <span class="mobile-cart-meta"><span data-cart-count>0</span> 項</span>
  </button>

  <div class="drawer-backdrop" data-cart-backdrop hidden></div>
  <aside class="cart-drawer" data-cart-drawer aria-labelledby="cart-title" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">已選商品</p>
        <h2 id="cart-title">詢價清單</h2>
      </div>
      <button class="icon-button" type="button" data-close-cart aria-label="關閉詢價清單">×</button>
    </div>

    <div class="drawer-scroll-area">
      <section class="cart-section" aria-labelledby="selected-products-title">
        <div class="section-row">
          <h3 id="selected-products-title">商品與數量</h3>
          <button class="text-button danger-text" type="button" data-clear-cart>清空全部</button>
        </div>
        <div class="cart-items" data-cart-items></div>
        <div class="cart-empty" data-cart-empty>
          <span aria-hidden="true">🧺</span>
          <p>還沒有加入商品。</p>
          <button class="button button-secondary" type="button" data-browse-products>回去挑商品</button>
        </div>
      </section>

      <section class="customer-section" aria-labelledby="customer-title">
        <h3 id="customer-title">詢價人資料</h3>
        <p class="form-help">店家名稱與聯絡人必填，請至少填一種聯絡方式。資料只暫存在這台裝置，不會上傳。</p>
        <form data-customer-form novalidate>
          <div class="form-grid">
            <label>
              <span>店家名稱 *</span>
              <input type="text" name="storeName" autocomplete="organization" required placeholder="例如：佳佳樂太平店">
              <small class="field-error" data-error-for="storeName"></small>
            </label>
            <label>
              <span>聯絡人 *</span>
              <input type="text" name="contactName" autocomplete="name" required placeholder="請輸入姓名">
              <small class="field-error" data-error-for="contactName"></small>
            </label>
            <label>
              <span>聯絡電話 *</span>
              <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required placeholder="09xx-xxx-xxx">
              <small class="field-error" data-error-for="phone"></small>
            </label>
            <label>
              <span>縣市／地區</span>
              <input type="text" name="area" autocomplete="address-level1" placeholder="例如：台中市太平區">
            </label>
            <label class="full-width">
              <span>備註／需求</span>
              <textarea name="note" rows="3" placeholder="例如：請報含稅價、預計需求數量、想詢問活動"></textarea>
            </label>
          </div>
        </form>
      </section>

      <section class="generated-section" data-generated-section hidden aria-labelledby="generated-title">
        <div class="section-row">
          <h3 id="generated-title">已產生詢價內容</h3>
          <span class="success-label">可以複製了</span>
        </div>
        <textarea class="generated-text" data-generated-text rows="12" readonly></textarea>
        <div class="generated-actions">
          <button class="button button-primary" type="button" data-share-inquiry>傳送詢價內容</button>
          <button class="button button-secondary" type="button" data-copy-inquiry>複製詢價內容</button>
        </div>
      </section>
    </div>

    <div class="drawer-footer">
      <button class="button button-primary full-button" type="button" data-generate-inquiry>產生詢價內容</button>
      <p>送出前仍可回頭調整商品與數量。</p>
    </div>
  </aside>

  <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>

  <template id="product-card-template">
    <article class="product-card" tabindex="0" role="button">
      <div class="product-image-wrap">
        <img class="product-image" alt="" loading="lazy" hidden>
        <div class="image-placeholder" aria-hidden="true">
          <span>商品圖片</span>
          <small>圖片整理中</small>
        </div>
      </div>
      <div class="product-content">
        <h3 class="product-name"></h3>
        <p class="product-spec"></p>
      </div>
    </article>
  </template>

  <template id="cart-item-template">
    <article class="cart-item">
      <div class="cart-item-main">
        <div>
          <span class="cart-item-brand"></span>
          <h4 class="cart-item-name"></h4>
          <p class="cart-item-spec"></p>
        </div>
        <button class="icon-button remove-button" type="button" aria-label="刪除商品">×</button>
      </div>
      <div class="quantity-row">
        <span>詢價箱數</span>
        <div class="quantity-control">
          <button type="button" class="quantity-button minus-button" aria-label="減少一箱">−</button>
          <input class="quantity-input" type="number" min="1" max="999" inputmode="numeric" aria-label="詢價箱數">
          <button type="button" class="quantity-button plus-button" aria-label="增加一箱">＋</button>
        </div>
      </div>
    </article>
  </template>

  <noscript>
    <p class="noscript-message">此型錄需要開啟 JavaScript 才能使用搜尋與詢價清單。</p>
  </noscript>
</body>
</html>
